<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דושי מקדונלדס | לא מפסיקים לאכול</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap');

:root {
    --red: #db0007;
    --yellow: #ffc72c;
    --black: #111;
    --gray: #f5f5f5;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: 'Rubik', sans-serif;
    background: white;
    color: var(--black);
}

/* ===== NAVBAR ===== */
nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 40px;
    background: white;
    border-bottom: 1px solid #e5e5e5;
}

nav .logo {
    font-size: 1.8rem;
    font-weight: 900;
    color: var(--red);
}

nav .cta {
    background: var(--red);
    color: white;
    padding: 12px 22px;
    border-radius: 30px;
    font-weight: 700;
    text-decoration: none;
}

/* ===== HERO ===== */
.hero {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    gap: 40px;
    padding: 100px 60px;

    background-image: url("image7.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

.hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
}

.hero > * {
    position: relative;
    color: white;
}

.hero h1 {
    font-size: 3.5rem;
    font-weight: 900;
    margin: 0 0 20px;
}

.hero p {
    font-size: 1.3rem;
    max-width: 500px;
}

.hero a {
    display: inline-block;
    margin-top: 25px;
    background: var(--yellow);
    color: black;
    padding: 14px 30px;
    border-radius: 40px;
    font-weight: 700;
    text-decoration: none;
}

/* ===== PROMO ===== */
.promo {
    padding: 90px 40px;
    text-align: center;
}

.promo h2 {
    font-size: 3rem;
    font-weight: 900;
    margin-bottom: 40px;
}

.video-box {
    max-width: 400px;
    margin: auto;
    border-radius: 20px;
    overflow: hidden;
}

.video-box video {
    width: 100%;
}

/* ===== GALLERY ===== */
.gallery {
    background: var(--gray);
    padding: 80px 40px;
}

.gallery h2 {
    text-align: center;
    font-size: 2.8rem;
    margin-bottom: 50px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 30px;
    max-width: 1200px;
    margin: auto;
}

.card {
    background: white;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
}

.card img {
    width: 100%;
    display: block;
}

.card p {
    padding: 18px;
    font-weight: 700;
}

/* ===== ORDER ===== */
.order {
    background: var(--red);
    color: white;
    padding: 90px 30px;
    text-align: center;
}

.order h2 {
    font-size: 3rem;
    margin-bottom: 20px;
}

.order a {
    display: inline-block;
    margin-top: 25px;
    background: white;
    color: var(--red);
    padding: 16px 40px;
    border-radius: 50px;
    font-size: 2rem;
    font-weight: 900;
    text-decoration: none;
}

/* ===== FOOTER ===== */
footer {
    background: #111;
    color: #aaa;
    text-align: center;
    padding: 25px;
    font-size: 0.9rem;
}

/* ===== MOBILE ===== */
@media (max-width: 768px) {
    .hero {
        grid-template-columns: 1fr;
        text-align: center;
        padding: 80px 30px;
    }
}
</style>
</head>

<body>

<nav>
    <div class="logo">דושי מקדונלדס</div>
    <a href="tel:0501234567" class="cta">הזמנה בטלפון</a>
</nav>

<section class="hero">
    <div>
        <h1>לא מפסיקים לאכול</h1>
        <p>
            תפריט אייקוני. דמות אחת.  
            ואין אפליקציה – רק דושי.
        </p>
        <a href="#order">להזמנה</a>
    </div>
</section>

<section class="promo">
    <h2>הפרסומת הרשמית</h2>
    <div class="video-box">
        <video controls>
            <source src="video.mp4" type="video/mp4">
            הדפדפן שלך לא תומך בווידאו
        </video>
    </div>
</section>

<section class="gallery">
    <h2>מה בתפריט?</h2>
    <div class="cards">
        <div class="card">
            <img src="image1.png" alt="">
            <p>ארוחת דושי קלאסית</p>
        </div>
        <div class="card">
            <img src="image2.png" alt="">
            <p>קינוח בננה פרימיום</p>
        </div>
        <div class="card">
            <img src="image3.jpg" alt="">
            <p>עובד החודש</p>
        </div>
        <div class="card">
            <img src="image4.jpg" alt="">
            <p>מהדורה מוגבלת</p>
        </div>
    </div>
</section>

<section class="order" id="order">
    <h2>מוכנים להזמין?</h2>
    <p>אין אפליקציה. אין קוד קופון.</p>
    <a href="tel:0547557261">📞</a>
</section>

<footer>
    © 2026 דושי מקדונלדס | פרודיה. רעב אמיתי.
</footer>

</body>
</html>
